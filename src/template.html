<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Mateusz Koteja (soanvig) personal page">
  <title>{{templateTitle}}</title>
  <style>
    html {
      color: #fff;
      background: #0F1113;
    }
  </style>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link rel="stylesheet" href="{{asset|./assets/reset.css}}">
  <link rel="stylesheet" href="{{asset|./assets/style.css}}">

  <link rel="icon" type="image/png" href="{{asset|./assets/favicon.png}}" />

  <link rel="preload" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,500;1,500&display=swap" as="style" onload="this.onload=null;this.rel='stylesheet'">
  <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,500;1,500&display=swap"></noscript>

  <link rel="preload" href="https://cdnjs.cloudflare.com/ajax/libs/prism/9000.0.1/themes/prism-okaidia.min.css" as="style" onload="this.onload=null;this.rel='stylesheet'">
  <noscript><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/prism/9000.0.1/themes/prism-okaidia.min.css"></noscript>
</head>
<body>
  <nav class="topbar">
    <h1><a href="/">kote<span class="deco">y</span>a.net</a></h1>
    <ul class="menu">
      <li class="menu_item"><a href="/blog">Blog</a></li>
    </ul>
  </nav>

  <div class="content">
    {{page}}
  </div>

  <footer>
    Last update of that page: {{fileDate}}<br>
    Last update of koteya.net: {{buildDate}}
  </footer>

  <script>
    window.Prism = window.Prism || {};
    window.Prism.manual = true;
  </script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/9000.0.1/prism.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/9000.0.1/components/prism-typescript.min.js"></script>
  <script>
    const langMap = {
      ts: 'typescript'
    }
    const codeBlocks = document.querySelectorAll('pre[lang]');

    for (const codeBlock of codeBlocks) {
      const lang = codeBlock.getAttribute('lang');
      codeBlock.classList.add(`language-${langMap[lang]}`);
    }

    Prism.highlightAll();
  </script>
</body>
</html>
